<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="СЕТ">
  <meta name="description" content="Особистий трекер тренувань. Вправи, ваги, підходи, прогрес — усе на твоєму телефоні.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" href="./icon-192.png" type="image/png">
  <link rel="stylesheet" href="./styles.css">
  <title>СЕТ — мої тренування</title>
</head>
<body>
  <aside id="notice" class="notice" role="alert" hidden><p id="noticeText"></p><div class="btn-row"><button id="noticeExport" class="btn alt sm">Зберегти копію</button><button id="noticeReload" class="btn alt sm">Повторити запуск</button></div></aside>
  <aside id="updateBanner" class="update-banner" role="status" hidden><span>Доступне оновлення СЕТ</span><button id="applyUpdate" class="btn sm">Оновити</button></aside>
  <div id="app"><div class="shell"><h1 class="page-title">СЕТ</h1><p class="subtle">Відкриваємо твої тренування…</p></div></div>
  <noscript>Увімкни JavaScript, щоб використовувати СЕТ.</noscript>
  <dialog id="modal"><div id="modalContent"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="./app.js" type="module"></script>
